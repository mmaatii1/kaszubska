name: Deploy via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ftp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show FTPS certificate names
        continue-on-error: true
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          echo | timeout 20 openssl s_client -starttls ftp -connect "$FTP_SERVER:21" 2>/dev/null \
            | openssl x509 -noout -subject -ext subjectAltName

      - name: Upload to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CLAUDE.md
            calibrate.html
            **/*:Zone.Identifier
            **/*:sec.endpointdlp
